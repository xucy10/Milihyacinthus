# Mili 下游 fork 构建模板配置
group = com.mili
version = 1.0.0-SNAPSHOT

# ---- Mili 上游 ----
# mili.repo=https://github.com/xucy10/Mili.git
# mili.ref=master

# ---- 下载稳定性（重试次数，指数退避，默认 2）----
paperweight.download.retries=3

# ---- 下载镜像（中国大陆构建加速，取消注释即启用 BMCLAPI）----
# 规则格式：原始URL前缀=镜像URL前缀，多条规则用英文逗号分隔，命中的第一条生效
# paperweight.download.mirrors=https://piston-meta.mojang.com=https://bmclapi2.bangbang93.com,https://piston-data.mojang.com=https://bmclapi2.bangbang93.com

# ---- 并发下载调优（默认 24 总连接 / 8 单路由；使用单一镜像源时可调大单路由）----
# paperweight.download.maxConnections=24
# paperweight.download.maxConnectionsPerRoute=16

# ---- Mojang 版本清单镜像（配合上面的 BMCLAPI 规则时无需再改此项）----
# paperweight.mojangManifestUrl=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json
